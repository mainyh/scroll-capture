name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Test
        run: pytest -q
      - name: Import check (UI modules)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import scrollcapture.controller, scrollcapture.app; print('ok')"
