name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Check tag matches __version__
        shell: pwsh
        run: |
          $v = python -c "import scrollcapture; print(scrollcapture.__version__)"
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} != __version__ $v" }

      - name: Test
        run: pytest -q

      - name: Build exe
        run: pyinstaller --noconfirm --clean scrollcapture.spec

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $name = "ScrollCapture-$tag-win-x64"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist\ScrollCapture.exe "out\$name.exe"
          $stage = "stage\$name"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item dist\ScrollCapture.exe, LICENSE, THIRD_PARTY_NOTICES.md, README.md, README.ko.md, CHANGELOG.md $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "out\$name.zip"
          Get-ChildItem out -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii out\SHA256SUMS.txt
          python tools/changelog_section.py $tag | Set-Content -Encoding utf8 notes.md
          Get-Content out\SHA256SUMS.txt

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $extra = @()
          if ($tag -match '-') { $extra += "--prerelease" }   # e.g. v1.0.0-rc1
          $files = (Get-ChildItem out -File).FullName
          gh release create $tag @files --title "ScrollCapture $tag" --notes-file notes.md @extra
